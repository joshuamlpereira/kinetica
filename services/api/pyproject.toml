[project]
name = "kinetica-api"
version = "0.0.0"
description = "Kinetica backend: FastAPI + SQLAlchemy async + Alembic."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pynacl>=1.5",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-pyjwt",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kinetica"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
