name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kinetica
          POSTGRES_PASSWORD: kinetica
          POSTGRES_DB: kinetica
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kinetica -d kinetica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KINETICA_DATABASE_URL: postgresql+asyncpg://kinetica:kinetica@localhost:5432/kinetica
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python and deps
        run: |
          uv python install 3.12
          uv sync --all-extras
      - name: Enable required Postgres extensions
        env:
          PGPASSWORD: kinetica
        run: |
          psql -h localhost -U kinetica -d kinetica \
            -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto"; CREATE EXTENSION IF NOT EXISTS "citext";'
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest -q

  schema-drift:
    name: schema drift (models vs DB, models vs docs)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kinetica
          POSTGRES_PASSWORD: kinetica
          POSTGRES_DB: kinetica
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kinetica -d kinetica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KINETICA_DATABASE_URL: postgresql+asyncpg://kinetica:kinetica@localhost:5432/kinetica
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: |
          uv python install 3.12
          uv sync
      - name: Enable required Postgres extensions
        env:
          PGPASSWORD: kinetica
        run: |
          psql -h localhost -U kinetica -d kinetica \
            -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto"; CREATE EXTENSION IF NOT EXISTS "citext";'
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Detect drift between models and DB
        run: uv run alembic check
      - name: Detect drift between models and docs/SCHEMA.sql
        run: uv run python scripts/render_schema.py --check

  mobile:
    name: mobile (typecheck, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

  ios-smoke:
    name: ios smoke build (simulator, unsigned)
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Install JS deps
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Expo prebuild (iOS)
        run: pnpm prebuild --platform ios --clean
      - name: Pod install
        run: cd ios && pod install --repo-update
      - name: Xcode build (simulator, no signing)
        run: |
          xcodebuild \
            -workspace ios/Kinetica.xcworkspace \
            -scheme Kinetica \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
